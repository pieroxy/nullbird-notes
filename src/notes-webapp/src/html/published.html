<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <!-- As the X-Robots-Tag header: a leaked link isn't to be found through a search engine. -->
  <meta name="robots" content="noindex, nofollow">
  <title>Note</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1b1d21">
</head>
<body>
  <div id="app"></div>
  <!-- Before the bundle: turns away browsers too old for it (see compat.js). -->
  <script src="/compat.js"></script>
</body>
</html>
