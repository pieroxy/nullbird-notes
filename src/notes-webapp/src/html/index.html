<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- cover: the page runs to the screen's edges, and the CSS keeps clear of what's there (see --safe-*). -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Notes</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="apple-mobile-web-app-title" content="Notes">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1b1d21">
</head>
<body>
  <!-- In the installed app on iOS 26+, keeps the system blur off the top bars (see .edgeguard). -->
  <div class="edgeguard" aria-hidden="true"></div>
  <div id="app"></div>
  <!-- Before the bundle: turns away browsers too old for it (see compat.js). -->
  <script src="/compat.js"></script>
</body>
</html>
